<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Quiz de Futebol</title>
</head>

<body>

    <div class="caixa-principal">

        <h1>⚽ Quiz de Futebol</h1>

        <div class="tela-inicial">

            <p>
                Bem-vindo ao Quiz de Futebol!
                <br><br>
                Teste seus conhecimentos sobre futebol,
                jogadores, seleções, Copas do Mundo e regras.
                <br><br>
                Escolha uma resposta e descubra se você acertou!
            </p>

            <button class="iniciar-btn">Iniciar</button>

        </div>

        <div class="caixa-perguntas"></div>

        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">

            <p class="texto-resultado"></p>

            <button class="novamente-btn">
                🔄 Tentar novamente
            </button>

        </div>

    </div>

    <script type="module" src="js/aleatorio.js"></script>
    <script type="module" src="js/perguntas.js"></script>
    <script type="module" src="js/script.js"></script>

</body>

</html>
